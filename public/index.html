<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fish Shop Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">🐟</div>
      <div class="brand-text">
        <span id="brand-name">Fish Shop</span>
        <small>Manager</small>
      </div>
    </div>
    <nav>
      <button class="nav-btn active" data-view="dashboard"><span class="nav-ico">📋</span> Today</button>
      <button class="nav-btn" data-view="orders"><span class="nav-ico">🧾</span> Orders</button>
      <button class="nav-btn" data-view="deliveries"><span class="nav-ico">🚚</span> Deliveries</button>
      <button class="nav-btn" data-view="customers"><span class="nav-ico">👤</span> Customers</button>
      <button class="nav-btn" data-view="products"><span class="nav-ico">🐠</span> Products</button>
      <button class="nav-btn" data-view="messages"><span class="nav-ico">💬</span> Messages</button>
      <button class="nav-btn" data-view="settings"><span class="nav-ico">⚙️</span> Settings</button>
    </nav>
    <button id="new-order-btn" class="btn primary big">＋ New Order</button>
    <div class="sidebar-footer">
      <div id="sms-mode" class="sms-mode"></div>
      <div class="user-box">
        <span id="user-name"></span>
        <button id="logout-btn" class="link-btn">Log out</button>
      </div>
    </div>
  </aside>

  <main id="main"></main>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div id="modal" class="modal"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
